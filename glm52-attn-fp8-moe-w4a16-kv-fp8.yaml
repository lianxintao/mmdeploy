# GLM-5.2 mixed-precision PTQ: FP8 attention, routed-expert W4A16 NVFP4,
# and FP8 KV-cache cast. Dense/shared MLPs and sensitive routing/indexing stay high precision.

imports:
  base_disable_all: configs/ptq/units/base_disable_all
  default_disabled_quantizers: configs/ptq/units/default_disabled_quantizers
  fp8: configs/numerics/fp8
  kv_fp8_cast: configs/ptq/units/kv_fp8_cast
  nvfp4: configs/numerics/nvfp4

metadata:
  recipe_type: ptq
  description: >-
    GLM-5.2 mixed-precision PTQ with W8A8 FP8 self-attention, W4A16 NVFP4
    routed-expert weights, and FP8 KV-cache cast. Shared experts, dense MLPs,
    routers, lm_head, MTP, and indexer weights_proj remain in high precision.

quantize:
  algorithm:
    method: max
    layerwise:
      enable: false
  quant_cfg:
    - $import: base_disable_all

    # Fused gate_up_proj/down_proj tensors receive per-expert NVFP4 weight quantizers.
    - quantizer_name: '*mlp.experts*weight_quantizer*'
      cfg: {$import: nvfp4}

    # Covers the MLA projections and DSA indexer projections below self_attn.
    - quantizer_name: '*self_attn*weight_quantizer*'
      cfg: {$import: fp8}
    - quantizer_name: '*self_attn*input_quantizer*'
      cfg: {$import: fp8}

    - $import: kv_fp8_cast
    - $import: default_disabled_quantizers

    # Transformers keeps this DSA scoring projection in FP32.
    - quantizer_name: '*self_attn.indexer.weights_proj*'
      enable: false
    - quantizer_name: '*mtp*'
      enable: false
